[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit"
version = "0.1.0"
description = "A small toolkit for orchestrating multi-agent workflows: spec-driven tasks with fan-out/fan-in execution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "anujbhsharma" }]
keywords = ["agents", "orchestration", "llm", "workflow"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agentkit = "agentkit.cli:main"

[tool.setuptools.packages.find]
include = ["agentkit*"]

[tool.setuptools.package-data]
agentkit = ["static/*.html"]
